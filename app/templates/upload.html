{# home form - file + optional passphrase / expiry / max downloads #}
{% extends "base.html" %}
{% block title %}auditlink - Upload{% endblock %}
{% block content %}
<section class="panel">
  <h2>Share a file</h2>
  <p class="lede">Tokenized link, optional passphrase, expiry, and download cap. Every access lands in the audit log.</p>
  <form action="/upload" method="post" enctype="multipart/form-data">
    <label>
      <strong>File</strong>
      <input type="file" name="file" required />
      <span class="hint">Max {{ max_upload_mb }} MB · stored outside the web root</span>
    </label>
    <label>
      <strong>Passphrase</strong> <span class="hint">(optional)</span>
      {# leave blank = open link; hashed server-side if set #}
      <input type="password" name="passphrase" autocomplete="new-password" placeholder="Leave blank for open link" />
    </label>
    <div class="row">
      <label>
        <strong>Expires in (hours)</strong>
        <input type="number" name="expiry_hours" min="1" max="720" value="{{ default_expiry_hours }}" />
      </label>
      <label>
        <strong>Max downloads</strong>
        <input type="number" name="max_downloads" min="1" max="100" value="{{ default_max_downloads }}" />
      </label>
    </div>
    <button class="btn" type="submit">Generate link</button>
  </form>
</section>
{% endblock %}
