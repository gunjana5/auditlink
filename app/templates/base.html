{# base.html - shell + brand; pages extend this #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}auditlink{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="shell">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <h1>auditlink</h1>
      <span>secure share · audit trail</span>
    </header>
    {% block content %}{% endblock %}
    <p class="footer">Portfolio demo - not production hardened. Files are never executed server-side.</p>
  </div>
</body>
</html>
